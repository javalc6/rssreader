import org.jetbrains.kotlin.gradle.dsl.JvmTarget

apply plugin: 'com.android.application'

android {
    compileSdk = 37

    defaultConfig {
        applicationId "livio.rssreader"
        minSdkVersion 24
        targetSdkVersion 37
        versionCode 131
        versionName "1.3.1"
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildTypes {
        release {
            shrinkResources = true
            minifyEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    namespace = 'livio.rssreader'
    buildFeatures {
        buildConfig = true
    }
    kotlin {
        compilerOptions {
            jvmTarget = JvmTarget.JVM_11
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.appcompat:appcompat-resources:1.8.0'

    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.work:work-runtime:2.11.2' //release 2.12 is incompatible with minSdkVersion 23
    implementation 'com.squareup.okhttp3:okhttp:5.5.1'

    implementation 'com.google.android.material:material:1.14.0'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}